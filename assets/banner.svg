<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 48px; font-weight: bold; fill: #ffffff; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; fill: #e0e0e0; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="15" ry="15" />
  <text x="50%" y="45%" text-anchor="middle" class="title" dominant-baseline="middle">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
    JEE Aspirants vs Acceptance
  </text>
  <text x="50%" y="70%" text-anchor="middle" class="subtitle" dominant-baseline="middle">
    70-Year Evolution (1956 - 2026)
  </text>
</svg>
